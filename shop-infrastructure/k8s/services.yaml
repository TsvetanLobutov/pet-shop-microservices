apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: eclipse-temurin:21-jre-alpine
          command: ["java", "-jar", "/app/app.jar"]
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: app-jar
              mountPath: /app
      volumes:
        - name: app-jar
          hostPath:
            path: /run/desktop/mnt/host/c/Users/Stivan/Desktop/JavaDev/api-gateway/target
            type: Directory
            
